version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ironpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ironpulse_user
      POSTGRES_PASSWORD: ironpulse_password
      POSTGRES_DB: ironpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
